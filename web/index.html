  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Qamar Zaman - Flutter & Mobile App Developer Portfolio. Cross-platform apps for Android, iOS, and Web.">
  <meta name="keywords" content="Flutter Developer, Mobile App Developer, Qamar Zaman, Android, iOS, Web">
  <meta name="author" content="Qamar Zaman">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph -->
  <meta property="og:title" content="Qamar Zaman - Flutter Developer">
  <meta property="og:description" content="Building cross-platform apps that solve real business problems.">
  <meta property="og:type" content="website">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0B1120;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #06B6D4;
      font-family: 'Segoe UI', sans-serif;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #06B6D4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Loading Portfolio...</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
